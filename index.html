<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд менеджеров</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2430;
    --border: #21262d;
    --border2: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --gold: #e3a03a;
    --gold2: #f0c060;
    --gold-dim: rgba(227,160,58,0.12);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,0.12);
    --red: #f85149;
    --red-dim: rgba(248,81,73,0.12);
    --blue: #58a6ff;
    --blue-dim: rgba(88,166,255,0.12);
    --orange: #d29922;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

  /* ============ LOGIN ============ */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(227,160,58,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 60% 80% at 100% 100%, rgba(88,166,255,0.05) 0%, transparent 60%),
                var(--bg);
  }
  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 18px;
    padding: 48px 52px;
    width: 100%; max-width: 420px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    animation: fadeUp .5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
  .login-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 13px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 8px;
  }
  .login-title {
    font-family: 'Oswald', sans-serif;
    font-size: 30px; font-weight: 600; color: var(--text);
    margin-bottom: 32px; line-height: 1.1;
  }
  .login-title span { color: var(--gold); }
  .form-label { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; display: block; }
  .form-input {
    width: 100%; padding: 13px 16px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif;
    outline: none; transition: border-color .2s, box-shadow .2s;
    margin-bottom: 20px;
  }
  .form-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(227,160,58,0.15); }
  .login-btn {
    width: 100%; padding: 14px;
    background: var(--gold); color: #0d1117;
    border: none; border-radius: 8px; font-family: 'Oswald', sans-serif;
    font-size: 15px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: background .2s, transform .1s;
    margin-top: 8px;
  }
  .login-btn:hover { background: var(--gold2); transform: translateY(-1px); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; text-align: center; }

  /* ============ APP ============ */
  #app-screen { display: none; min-height: 100vh; flex-direction: column; }

  /* Header */
  .header {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
    height: 60px; position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .header-brand { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .header-sep { width: 1px; height: 28px; background: var(--border2); }
  .header-title { font-size: 14px; color: var(--text2); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .user-badge {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 24px; padding: 5px 16px 5px 5px;
  }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #b87820);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; color: #000;
  }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .logout-btn {
    background: none; border: 1px solid var(--border2); border-radius: 8px;
    color: var(--text2); font-size: 12px; padding: 6px 14px;
    cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  /* Tabs (director only) */
  .tabs-bar {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 0 32px; display: flex; gap: 4px; overflow-x: auto;
  }
  .tab-btn {
    padding: 14px 22px; font-size: 13px; font-weight: 500;
    color: var(--text2); background: none; border: none; border-bottom: 2px solid transparent;
    cursor: pointer; transition: all .2s; white-space: nowrap;
    font-family: 'Inter', sans-serif;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* Main content */
  .main { padding: 28px 32px; flex: 1; }

  /* Period selector */
  .period-row { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .period-label { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
  .period-btn {
    padding: 6px 18px; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 20px; font-size: 13px; color: var(--text2);
    cursor: pointer; transition: all .2s; font-family: 'Inter', sans-serif;
  }
  .period-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); font-weight: 600; }

  /* Section title */
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 14px; margin-top: 28px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content:''; flex:1; height:1px; background: var(--border); }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .kpi-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px;
    transition: border-color .2s, transform .2s;
    animation: fadeUp .4s ease both;
  }
  .kpi-card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .kpi-card.gold-accent { border-color: rgba(227,160,58,0.3); }
  .kpi-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
  .kpi-value { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
  .kpi-value.gold { color: var(--gold); }
  .kpi-value.green { color: var(--green); }
  .kpi-value.red { color: var(--red); }
  .kpi-sub { font-size: 12px; color: var(--text3); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .kpi-badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .kpi-badge.green { background: var(--green-dim); color: var(--green); }
  .kpi-badge.red { background: var(--red-dim); color: var(--red); }
  .kpi-badge.gold { background: var(--gold-dim); color: var(--gold); }

  /* Progress bar */
  .progress-wrap { margin-top: 10px; }
  .progress-bar-bg { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 2px; background: var(--gold); transition: width .8s ease; }
  .progress-bar-fill.green { background: var(--green); }

  /* Charts row */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 4px; }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px;
    animation: fadeUp .4s ease both;
  }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 18px; }

  /* Bar chart */
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-wrap { width: 100%; display: flex; gap: 3px; align-items: flex-end; }
  .bar-col { flex: 1; border-radius: 4px 4px 0 0; transition: opacity .2s; min-height: 2px; }
  .bar-col:hover { opacity: .8; }
  .bar-label { font-size: 11px; color: var(--text3); text-align: center; margin-top: 4px; }
  .bar-legend { display: flex; gap: 14px; margin-top: 12px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }

  /* Donut chart */
  .donut-wrap { display: flex; align-items: center; gap: 24px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .donut-item { display: flex; justify-content: space-between; align-items: center; }
  .donut-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
  .donut-dot { width: 8px; height: 8px; border-radius: 50%; }
  .donut-value { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); }

  /* Table */
  .table-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    animation: fadeUp .4s ease both;
  }
  .table-header { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-title { font-size: 13px; font-weight: 600; color: var(--text2); }
  .table-count { font-size: 12px; color: var(--text3); background: var(--bg3); border-radius: 20px; padding: 2px 10px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 11px 14px; text-align: left;
    font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text3); border-bottom: 1px solid var(--border);
    background: var(--bg2); position: sticky; top: 0;
  }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody td { padding: 12px 14px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  .num { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 400; }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .status-badge.paid { background: var(--green-dim); color: var(--green); }
  .status-badge.unpaid { background: var(--red-dim); color: var(--red); }
  .status-badge.partial { background: var(--gold-dim); color: var(--gold); }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* Director manager cards */
  .mgr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .mgr-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px;
    animation: fadeUp .4s ease both;
    cursor: pointer; transition: border-color .2s, transform .2s;
  }
  .mgr-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .mgr-name { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .mgr-role { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
  .mgr-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mgr-stat { background: var(--bg3); border-radius: 8px; padding: 12px 14px; }
  .mgr-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 4px; }
  .mgr-stat-val { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .mgr-stat-val.green { color: var(--green); }
  .mgr-stat-val.red { color: var(--red); }
  .mgr-stat-val.gold { color: var(--gold); }

  /* Rank list */
  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-item { display: flex; align-items: center; gap: 12px; }
  .rank-num { font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--text3); width: 20px; text-align: right; flex-shrink: 0; }
  .rank-bar-wrap { flex: 1; }
  .rank-company { font-size: 12px; color: var(--text2); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .rank-bar-bg { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .rank-bar-fill { height: 100%; border-radius: 3px; background: var(--gold); }
  .rank-amount { font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--text); flex-shrink: 0; min-width: 80px; text-align: right; }

  /* Scrollable table wrapper */
  .table-scroll { max-height: 420px; overflow-y: auto; }
  .table-scroll::-webkit-scrollbar { width: 4px; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Empty state */
  .empty-state { text-align: center; padding: 48px; color: var(--text3); font-size: 13px; }

  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 0 16px; }
    .main { padding: 20px 16px; }
    .tabs-bar { padding: 0 16px; }
    .kpi-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Строительная лаборатория</div>
    <div class="login-title">Портал<br><span>менеджеров</span></div>
    <label class="form-label">Логин</label>
    <input class="form-input" type="text" id="inp-login" placeholder="Введите логин" autocomplete="username">
    <label class="form-label">Пароль</label>
    <input class="form-input" type="password" id="inp-pass" placeholder="Введите пароль" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Войти</button>
    <div class="login-error" id="login-error">Неверный логин или пароль</div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen" style="display:none;flex-direction:column;">
  <div class="header">
    <div class="header-left">
      <div class="header-brand">СтройЛаб</div>
      <div class="header-sep"></div>
      <div class="header-title" id="header-subtitle">Дашборд менеджера</div>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-name" id="user-name-display">—</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Выйти</button>
    </div>
  </div>

  <!-- Tabs (director only) -->
  <div class="tabs-bar" id="tabs-bar" style="display:none;">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab(this)">Общий дашборд</button>
    <button class="tab-btn" data-tab="aleksandrov" onclick="switchTab(this)">Александров С</button>
    <button class="tab-btn" data-tab="martynov" onclick="switchTab(this)">Мартынов А</button>
    <button class="tab-btn" data-tab="sinchagova" onclick="switchTab(this)">Синчагова С</button>
  </div>

  <div class="main" id="main-content"></div>
</div>

document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogin() {
  const login = document.getElementById('inp-login').value.trim().toLowerCase();
  const pass  = document.getElementById('inp-pass').value;
  const user  = USERS[login];
  if (user && user.pass === pass) {
    currentUser = { ...user, login };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('user-name-display').textContent = currentUser.name;
    document.getElementById('user-avatar').textContent = currentUser.initials;
    if (currentUser.role === 'director') {
      document.getElementById('tabs-bar').style.display = 'flex';
      document.getElementById('header-subtitle').textContent = 'Дашборд руководителя';
    } else {
      document.getElementById('header-subtitle').textContent = 'Личный дашборд';
    }
    renderContent();
  } else {
    const err = document.getElementById('login-error');
    err.style.display = 'block';
    err.style.animation = 'none';
    setTimeout(() => err.style.animation = '', 10);
  }
}

function doLogout() {
  currentUser = null; currentPeriod = "all"; currentTab = "overview";
  document.getElementById('login-screen').style.display = 'flex';

// ============ TAB / PERIOD ============
function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  renderContent();
}

function setPeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  renderContent();
}

// ============ DATA HELPERS ============
function getRows(manager) {
  let rows = REGISTRY;
  if (manager) rows = rows.filter(r => r.manager === manager);
  if (currentPeriod === '1') rows = rows.filter(r => r.month === '1');
  if (currentPeriod === '2') rows = rows.filter(r => r.month === '2');
  return rows;
}

function fmt(n) {
  return Math.round(n).toLocaleString('ru-RU') + ' ₽';
}
function fmtK(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + ' млн';
  if (n >= 1000) return (n/1000).toFixed(0) + ' тыс';
  return Math.round(n).toString();
}
function pct(a, b) { return b ? Math.round(a/b*100) : 0; }
function bar(val, pct_val, color='') {
  const c = color || (pct_val >= 100 ? 'green' : '');
  return `<div class="progress-bar-bg"><div class="progress-bar-fill ${c}" style="width:${Math.min(pct_val,100)}%"></div></div>`;
}

function topClients(rows, n=5) {
  const map = {};
  rows.forEach(r => { if(r.company) map[r.company] = (map[r.company]||0) + r.fact; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n).filter(x=>x[1]>0);
}

function byTestType(rows) {
  const map = {};
  rows.forEach(r => { if(r.test_type) map[r.test_type] = (map[r.test_type]||0) + r.fact; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5).filter(x=>x[1]>0);
}

// ============ RENDER ============
function renderContent() {
  const c = document.getElementById('main-content');
  if (currentUser.role === 'manager') {
    c.innerHTML = renderManagerDash(currentUser.manager);
  } else {
    if (currentTab === 'overview') c.innerHTML = renderDirectorOverview();
    else {
      const map = { aleksandrov: 'Александров С', martynov: 'Мартынов А', sinchagova: 'Синчагова С' };
      c.innerHTML = renderManagerDash(map[currentTab]);
    }
  }
  // Animate bars after render
  setTimeout(() => {
    document.querySelectorAll('.progress-bar-fill, .rank-bar-fill').forEach(el => {
      const w = el.style.width; el.style.width = '0'; setTimeout(()=>el.style.width=w, 50);
    });
  }, 0);
}

function periodSelector() {
  return `<div class="period-row">

    <button class="period-btn ${currentPeriod==='all'?'active':''}" data-p="all" onclick="setPeriod('all')">Всего 2026</button>

}

  <div class="section-title">Дебиторская задолженность (Апрель 2026)</div>

      <tbody>

          <tr>

function switchToMgr(name) {
  const map = { 'Александров С':'aleksandrov', 'Мартынов А':'martynov', 'Синчагова С':'sinchagova' };
  const tab = document.querySelector(`.tab-btn[data-tab="${map[name]}"]`);
  if (tab) switchTab(tab);
}

// ============ SVG ARC ============
function describeArc(cx, cy, r, startAngle, endAngle, color) {
  if (Math.abs(endAngle - startAngle) < 0.01) return '';
  const start = polarToCart(cx, cy, r, startAngle);
  const end   = polarToCart(cx, cy, r, endAngle);
  const large = (endAngle - startAngle) > 180 ? 1 : 0;
  return `<path d="M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y} Z" fill="${color}" opacity="0.9"/>`;
}
function polarToCart(cx, cy, r, angle) {
  const rad = (angle - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
